services:
  - type: web
    name: aicte-flowops-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: aicte-flowops-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://aicte-flowops.vercel.app
      # Cloud Object Storage (AWS S3-compatible cloud storage)
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      # Background Jobs & Notifications
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "15"
      # AI Workflow Intelligence
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: deterministic

databases:
  - name: aicte-flowops-db
    databaseName: aicte_flowops
    user: aicte
    plan: free
