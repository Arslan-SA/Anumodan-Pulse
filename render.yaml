services:
  - type: web
    name: aicte-flowops-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: aicte-flowops-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://aicte-flowops.vercel.app
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: ./storage/uploads
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "15"
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: deterministic

databases:
  - name: aicte-flowops-db
    databaseName: aicte_flowops
    user: aicte
    plan: free
